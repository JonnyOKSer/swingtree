[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[dev]
  command = "npm run dev"
  targetPort = 5173
  autoLaunch = false

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Scheduled function: Capture results every 15 minutes
# Copies completed matches from draw_matches to permanent match_results table
# CRITICAL: This ensures we have results even after tournaments end
[functions."capture-results"]
  schedule = "*/15 * * * *"

# Scheduled function: Auto-reconcile every 10 minutes
# PRIMARY reconciliation engine - uses match_results (permanent) + draw_matches + ESPN
# Railway auto-reconcile is BACKUP only (has cron reliability issues)
[functions."auto-reconcile"]
  schedule = "*/10 * * * *"

# Scheduled function: Sync draw data from api-tennis.com every 15 minutes
[functions."sync-draw"]
  schedule = "*/15 * * * *"

# Scheduled function: Reconcile orphaned predictions every 15 minutes
[functions."reconcile-predictions"]
  schedule = "*/15 * * * *"

# Scheduled function: Update live matches status every 5 minutes (ESPN-based)
# Uses ESPN completed matches to fix stale "live" statuses
[functions."fix-live-status"]
  schedule = "*/5 * * * *"

# KEEP-WARM: Prevent Railway cold starts
# Pings Railway health every 10 minutes to keep service responsive
# Railway cold starts take 30-40+ seconds, causing watchdog timeouts
[functions."keep-warm"]
  schedule = "*/10 * * * *"

# WATCHDOG: External monitor for Tennis Oracle Railway service
# Checks every 30 minutes so missed slots retry quickly instead of waiting 2h.
# Background function (-background suffix) → 15-min timeout instead of 26s,
# so Railway cold starts no longer kill the check.
# CRITICAL: This runs EXTERNAL to Railway to catch Railway cron failures
[functions."watchdog-background"]
  schedule = "*/30 * * * *"

# DAILY TRIGGER: Unconditionally POST /trigger at 09:00 UTC as a redundant
# path for Railway's own daily-predictions cron. If Railway cron dies silently
# (has happened twice), this catches it in the morning window instead of
# waiting for the watchdog to notice something's missing.
[functions."daily-predictions-trigger-background"]
  schedule = "0 9 * * *"

# API routes
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
